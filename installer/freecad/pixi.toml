# Builds the EMSolution FreeCAD Windows installer: conda packages with rattler-build, then the .exe with constructor.
# pixi run installer          -> dist\EMSolution-FreeCAD-<version>-Windows-x86_64.exe
# pixi run nsis-pyemsi        -> ..\..\dist\pyemsi-<version>-setup.exe (needs the portable runtime in ..\..\dist\pyemsi)
# <version> is pyemsi.__version__, read by ../version.py; every task sets PYEMSI_VERSION from it.
# pyemsi and the addon (freecad_addon/) are built from this repo.
[workspace]
name = "emsolution-installer"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
rattler-build = "*"
constructor = "*"
conda-standalone = "*"
nsis = "*"

[tasks]
# --no-build-id keeps pyemsi's deepest Monaco file under Windows' 260-char MAX_PATH; build from a short checkout path.
# Without build ids a failed build's dir is reused, hence the cleanup (pixi's rm chokes on read-only files).
packages = "export PYEMSI_VERSION=$(python ../version.py) && powershell -NoProfile -Command \"Remove-Item -Recurse -Force output/bld -ErrorAction SilentlyContinue\" ; rattler-build build --recipe-dir recipes --output-dir output -c conda-forge --skip-existing=local --no-build-id"
installer = { cmd = "export PYEMSI_VERSION=$(python ../version.py) && constructor . --output-dir dist", depends-on = ["packages"] }
# The pyemsi NSIS installer; makensis comes from this workspace's nsis package, so no system NSIS is needed.
nsis-pyemsi = "makensis /DAPP_VERSION=$(python ../version.py) ../pyemsi.nsi"
