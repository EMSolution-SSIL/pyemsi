name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (windows)
    # The pixi workspace only targets win-64.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Mesa software OpenGL: the runners have no GPU and VTK needs OpenGL >= 3.2.
      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          locked: true
          environments: default addon
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # tests/conftest.py runs Qt on the offscreen platform.
      - name: Run pyemsi tests
        run: pixi run test

      - name: Run FreeCAD add-on tests
        run: pixi run -e addon test-addon
